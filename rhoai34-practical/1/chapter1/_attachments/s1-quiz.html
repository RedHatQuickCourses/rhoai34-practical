<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
      /* --- Basic Styles --- */
        :root {
            --correct-color: #63993d;
            --incorrect-color: #f0561d;
            --intro-color: #111;
            --next-btn-color: #0066cc;
            --prev-btn-color: #383838;
            --restart-btn-color: #ee0000;
            --text-color: #111;
        }

        body {
            font-family: 'Red Hat Display', sans-serif;
            color: var(--text-color);
            margin: 1.5em;
        }

        /* --- Quiz Components --- */
        #quiz-intro {
            color: var(--intro-color);
            margin-bottom: 2em;
            line-height: 1.6;
            background-color: #f4f4f4;
            padding: 1.5em;
            border-left: 4px solid #ee0000;
            border-radius: 4px;
        }

        #question-counter {
            color: #383838;
            margin-bottom: 1em;
            font-weight: 700;
        }

        #question-container {
            margin-bottom: 1.5em;
        }

        #question-text {
            font-size: 1.25em;
            font-weight: 700;
            margin-bottom: 1em;
        }

        .answer-item {
            margin-bottom: 1em;
        }

        .answer-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 0.75em;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        .answer-label:hover {
            border-color: #999;
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #555;
            border-radius: 4px;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.3s;
        }

        .explanation {
            display: none;
            padding: 0.75em;
            margin-top: 0.5em;
            border-radius: 8px;
            line-height: 1.6;
        }
        
        .explanation a {
            color: inherit;
            text-decoration: underline;
        }

        /* --- State Styling --- */
        .answer-item.answered.correct .answer-label,
        .answer-item.answered.correct .explanation {
            background-color: #f0f8ec;
            border-color: var(--correct-color);
            color: var(--correct-color);
        }

        .answer-item.answered.incorrect .answer-label,
        .answer-item.answered.incorrect .explanation {
            background-color: #fff0e9;
            border-color: var(--incorrect-color);
            color: var(--incorrect-color);
        }

        .answer-item.answered.correct .custom-checkbox {
            border-color: var(--correct-color);
            background-color: var(--correct-color);
            color: white;
        }

        .answer-item.answered.incorrect .custom-checkbox {
            border-color: var(--incorrect-color);
            background-color: var(--incorrect-color);
            color: white;
        }

        /* --- Results Screen --- */
        #results-container {
            display: none;
            text-align: center;
            padding: 2.5em;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 2em;
        }

        .score-text {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 0.2em;
        }

        .score-details {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 1.5em;
        }

        .pass { color: var(--correct-color); }
        .fail { color: var(--incorrect-color); }

        .results-message {
            font-size: 1.1em;
            line-height: 1.6;
        }

        /* --- Navigation --- */
        #navigation-container {
            margin-top: 2em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            border: none;
            padding: 0.8em 1.5em;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            color: white;
            transition: opacity 0.3s;
        }

        .nav-button:hover {
            opacity: 0.85;
        }

        #prev-btn { background-color: var(--prev-btn-color); }
        #next-btn { background-color: var(--next-btn-color); }
        #results-btn { background-color: var(--correct-color); }
        #restart-btn { background-color: var(--restart-btn-color); }
    </style>
  </head>
  <body>
    <div id="quiz-container">
      <div id="quiz-intro"></div>
      
      <div id="results-container">
          <div class="score-text" id="final-score-percent"></div>
          <div class="score-details" id="final-score-breakdown"></div>
          <div class="results-message" id="final-message"></div>
      </div>

      <div id="question-counter"></div>
      <div id="question-container">
        <p id="question-text"></p>
        <div id="answers-container"></div>
      </div>
      
      <div id="navigation-container">
        <button id="prev-btn" class="nav-button" style="display: none;">Previous</button>
        <button id="next-btn" class="nav-button" style="display: none;">Next</button>
        <button id="results-btn" class="nav-button" style="display: none;">View Results</button>
        <button id="restart-btn" class="nav-button" style="display: none;">Restart Gateway</button>
      </div>
    </div>
    
    <script>
      const quizDataText = `<b>Welcome to the Diagnostic Gateway.</b> <br><br>Before diving into the engine room, we need to ensure your foundational platform is solidly constructed. This assessment tests your real-world administrative knowledge of OpenShift AI 3.4. We are specifically testing your ability to navigate Operator dependencies, configure the DataScienceCluster Custom Resources, and properly route inference traffic using the modern Gateway API.<br><br><b>The 80% Rule:</b> If you score 80% or higher, you have proven your mastery of the platform setup and may skip the foundational lab. If you score below 80%, you will proceed to the interactive labs to build these critical skills.

---
Q1: You are preparing an OpenShift cluster for massive generative AI models using Distributed Inference (llm-d). Which of the following Operators are explicit prerequisites for this capability in 3.4?

A: OpenShift Pipelines and OpenShift Serverless
Incorrect: These are not the specific prerequisites for llm-d. In fact, Serverless deployment mode for KServe is deprecated.

A: cert-manager Operator, Red Hat Connectivity Link Operator, and Leader Worker Set Operator
Correct: To deploy models using the new Distributed Inference with llm-d framework, the cluster requires cert-manager, Red Hat Connectivity Link (for auth/routing), and the Leader Worker Set Operator to manage the distributed pod topology.

A: Service Mesh Operator and Authorino Operator
Incorrect: While related to networking and auth, these are not the specific prerequisites for llm-d.

A: Knative Serving and NVIDIA GPU Operator
Incorrect: Knative Serving is related to the deprecated Serverless mode, not llm-d.
---
Q2: When installing the Red Hat OpenShift AI Operator via OperatorHub, you select the "Manual" update approval strategy. What does this mean for future minor version upgrades?

A: OLM will skip intermediate versions and upgrade directly to the latest approved version.
Incorrect: OLM for this operator requires sequential updates.

A: The cluster administrator must manually approve each sequential update between the current version and the final target version.
Correct: By default, the OpenShift AI Operator follows a sequential update process. If set to Manual, OLM requires the cluster administrator to manually approve each intermediate version before reaching the target version.

A: The Operator will automatically update, but components like KServe require manual restarts.
Incorrect: "Manual" applies to the operator installation approval, not component restarts.

A: You must uninstall and reinstall the Operator for every minor release.
Incorrect: Reinstallation is not necessary; sequential approval is.
---
Q3: You need to enable the new centralized observability stack (Prometheus, Tempo, OpenTelemetry) to monitor OpenShift AI components. Where is this configured?

A: In the OdhDashboardConfig custom resource under spec.monitoring.
Incorrect: The dashboard config is used to display the UI, but not to provision the stack itself.

A: By creating a ServiceMonitor in the openshift-monitoring namespace.
Incorrect: OpenShift AI manages its own stack separately from the cluster's default platform monitoring.

A: In the DataScienceClusterInitialization (DSCI) custom resource under spec.monitoring.managementState.
Correct: The centralized observability stack is enabled by setting managementState: Managed under the spec.monitoring section of the DSCInitialization (DSCI) custom resource.

A: In the DataScienceCluster (DSC) custom resource under spec.components.observability.
Incorrect: It is configured in the DSCI, not the DSC.
---
Q4: Starting in 3.4, MLflow is no longer just a Developer Preview feature; it is a fully managed component. How do you activate it during cluster setup?

A: By deploying a standalone Helm chart in the mlflow-system namespace.
Incorrect: It is natively managed now, not deployed via standalone Helm.

A: By setting the mlflow feature flag to true in the OdhDashboardConfig.
Incorrect: This was the old way when it was in Developer Preview.

A: By setting spec.components.mlflowoperator.managementState to Managed in the DataScienceCluster (DSC) CR.
Correct: The MLflow Operator is now a natively managed component. It is enabled by setting its managementState to Managed directly in the DataScienceCluster CR, replacing the old dashboard feature flags.

A: MLflow is activated by default when installing the OpenShift AI Operator.
Incorrect: You must explicitly set it to Managed in the DSC.
---
Q5: In previous versions of OpenShift AI, KServe relied on OpenShift Serverless (Knative) and Service Mesh. What is the recommended and supported deployment mode for KServe in 3.4?

A: Serverless Deployment Mode
Incorrect: The KServe Serverless deployment mode is deprecated starting in 2.25/3.0.

A: RawDeployment Mode
Correct: In 3.4, models should be deployed using KServe RawDeployment mode, which relies on the Kubernetes Gateway API rather than Knative Serverless.

A: ModelMesh Mode
Incorrect: ModelMesh is used for multiple small models, but RawDeployment is the modern recommendation replacing Serverless.

A: Standalone Mode
Incorrect: This is not the valid terminology for OpenShift AI's KServe deployment modes.
---
Q6: You want the centralized OpenShift AI observability stack to automatically scrape metrics from a user's newly deployed custom model server pod. How do you achieve this?

A: Apply the monitoring.opendatahub.io/scrape: 'true' label to the pod template in the workload's deployment configuration.
Correct: The monitoring system relies on the monitoring.opendatahub.io/scrape=true label to identify which pods Prometheus should scrape for metrics in user workloads.

A: Add the user's project to the DataScienceCluster CR.
Incorrect: Projects are not added to the DSC for monitoring purposes.

A: Set spec.dashboardConfig.disableKServeMetrics to false.
Incorrect: This is not a valid configuration.

A: Restart the kserve-controller-manager pod.
Incorrect: Restarting the pod does not instruct Prometheus to scrape user workloads.
---
Q7: A data science team wants to deploy a classical machine learning model trained on structured data using Scikit-learn and XGBoost. Which 3.4 GA serving runtime is best suited for this?

A: vLLM NVIDIA GPU ServingRuntime
Incorrect: vLLM is designed for Large Language Models, not classical ML.

A: MLServer ServingRuntime for KServe
Correct: The MLServer ServingRuntime for KServe is now Generally Available in 3.4 and is specifically designed to deploy classical machine learning models trained on structured data using frameworks like Scikit-learn, XGBoost, and LightGBM.

A: Caikit-TGIS Runtime
Incorrect: TGIS is generally for foundation models/LLMs, and is being superseded by vLLM in many use cases.

A: OpenVINO Model Server (OVMS)
Incorrect: OVMS is primarily for OpenVINO optimized models, while MLServer is specifically highlighted for Scikit-learn/XGBoost.
---
Q8: When deploying a model via the OpenShift AI UI, how does the system attempt to automatically select the best serving runtime for a user?

A: By pinging the model registry to find the model's original training environment.
Incorrect: The runtime selection does not ping the registry for this.

A: By analyzing the selected model framework and the accelerator defined in the user's chosen hardware profile.
Correct: OpenShift AI suggests a runtime by analyzing the model type, format, and matching the accelerator defined in the selected hardware profile with available runtimes (e.g., suggesting vLLM if an NVIDIA GPU profile is selected).

A: By defaulting to the OpenVINO Model Server for all deployments.
Incorrect: It dynamically selects based on profiles and frameworks.

A: By parsing the requirements.txt file located in the model's S3 bucket.
Incorrect: It does not parse the S3 bucket's text files for this decision.
---
Q9: To securely route inference requests to external models (like OpenAI or AWS Bedrock) using the same Models-as-a-Service (MaaS) gateway used for internal models, what custom resource must be created?

A: ExternalModel
Correct: Platform engineers define external LLM provider configurations using the ExternalModel custom resource, specifying the provider endpoint and credentials so MaaS can route and govern the traffic.

A: MaaSModelRef
Incorrect: This is not a valid OpenShift AI custom resource.

A: ServingRuntime
Incorrect: ServingRuntime is used for hosting models inside the cluster, not routing externally.

A: InferenceService
Incorrect: InferenceService deploys models in the cluster, not external gateways.
---
Q10: You deploy a test model using KServe RawDeployment. To ensure the model is accessible to external client applications (outside the cluster network), what action must you take during deployment?

A: Manually create an OpenShift Route pointing to port 8080.
Incorrect: KServe with Gateway API handles this automatically if requested.

A: Select the "Make deployed models available through an external route" checkbox in the UI deployment wizard.
Correct: To make a deployed model available to external clients, the administrator or user must select the "Make deployed models available through an external route" checkbox during configuration, which instructs the platform to configure external ingress.

A: Change the NetworkPolicy of the redhat-ods-applications namespace.
Incorrect: You do not need to manually change NetworkPolicies for standard external access.

A: Set the model visibility to "Public" in the Model Registry.
Incorrect: Model Registry visibility dictates who can see the model asset, not the network ingress routing.`;

      // --- PARSING LOGIC ---
      function parseQuizData(text) {
          try {
              const parts = text.split('---');
              const intro = parts.shift().trim();
              
              const questions = parts.filter(p => p.trim() !== '').map((part) => {
                  const lines = part.trim().split('\n').map(l => l.trim()).filter(l => l !== '');
                  if (lines.length === 0) return null;

                  const questionLine = lines.shift();
                  const questionText = questionLine.replace(/^Q\d+:\s*/, '').trim();
                  
                  const answers = [];
                  let currentAnswer = null;

                  for (const line of lines) {
                      if (line.startsWith('A:')) {
                          if (currentAnswer) {
                              answers.push(currentAnswer);
                          }
                          currentAnswer = { text: line.substring(2).trim(), isCorrect: false, explanation: '' };
                      } else if (line.startsWith('Correct:')) {
                          if(currentAnswer) {
                              currentAnswer.isCorrect = true;
                              currentAnswer.explanation = line.substring(8).trim();
                          }
                      } else if (line.startsWith('Incorrect:')) {
                           if(currentAnswer) {
                              currentAnswer.isCorrect = false;
                              currentAnswer.explanation = line.substring(10).trim();
                          }
                      } else {
                          if (currentAnswer) {
                              currentAnswer.explanation += ' ' + line;
                          }
                      }
                  }
                  if (currentAnswer) {
                      answers.push(currentAnswer);
                  }
                  
                  return { question: questionText, answers: answers, firstAttemptCorrect: null };
              }).filter(q => q !== null);

              return { intro, questions };
          } catch (e) {
              console.error("Failed to parse quiz data:", e);
              return { intro: "<span style='color:red;'>Fatal Parsing Error. Check developer console.</span>", questions: [] };
          }
      }

      // --- QUIZ APPLICATION LOGIC ---
      try {
          const { intro, questions } = parseQuizData(quizDataText);
          let currentQuestionIndex = 0;

          const introEl = document.getElementById('quiz-intro');
          const questionCounterEl = document.getElementById('question-counter');
          const questionTextEl = document.getElementById('question-text');
          const answersContainerEl = document.getElementById('answers-container');
          
          const resultsContainerEl = document.getElementById('results-container');
          const finalScorePercentEl = document.getElementById('final-score-percent');
          const finalScoreBreakdownEl = document.getElementById('final-score-breakdown');
          const finalMessageEl = document.getElementById('final-message');

          const nextBtn = document.getElementById('next-btn');
          const prevBtn = document.getElementById('prev-btn');
          const resultsBtn = document.getElementById('results-btn');
          const restartBtn = document.getElementById('restart-btn');

          introEl.innerHTML = intro;

          if (!questions || questions.length === 0) {
              questionTextEl.innerHTML = "<span style='color:red;'>No questions were loaded. Ensure the data format is correct.</span>";
          } else {
              function displayQuestion(index) {
                  const question = questions[index];
                  questionCounterEl.style.display = 'block';
                  questionContainerEl = document.getElementById('question-container');
                  questionContainerEl.style.display = 'block';
                  resultsContainerEl.style.display = 'none';

                  questionCounterEl.textContent = `Question ${index + 1} of ${questions.length}`;
                  questionTextEl.textContent = question.question;
                  answersContainerEl.innerHTML = '';

                  question.answers.forEach((answer, answerIndex) => {
                      const answerItem = document.createElement('div');
                      answerItem.className = 'answer-item';
                      
                      answerItem.innerHTML = `
                          <div class="answer-label" data-index="${answerIndex}">
                              <span class="custom-checkbox"></span>
                              <span class="answer-text">${answer.text}</span>
                          </div>
                          <div class="explanation">${answer.explanation}</div>
                      `;
                      answersContainerEl.appendChild(answerItem);
                  });
                  
                  updateNavigation();
              }
              
              function handleAnswerClick(event) {
                  const label = event.target.closest('.answer-label');
                  if (!label) return;

                  const answerItem = label.parentElement;
                  const explanation = answerItem.querySelector('.explanation');
                  const checkbox = label.querySelector('.custom-checkbox');

                  const isAnswered = answerItem.classList.contains('answered');

                  if (isAnswered) {
                       answerItem.classList.remove('answered', 'correct', 'incorrect');
                       explanation.style.display = 'none';
                       checkbox.textContent = '';
                  } else {
                      const answerIndex = parseInt(label.dataset.index);
                      const answer = questions[currentQuestionIndex].answers[answerIndex];
                      
                      // Track Score: Only record the very first attempt per question
                      if (questions[currentQuestionIndex].firstAttemptCorrect === null) {
                          questions[currentQuestionIndex].firstAttemptCorrect = answer.isCorrect;
                      }

                      answerItem.classList.add('answered');
                      explanation.style.display = 'block';

                      if (answer.isCorrect) {
                          answerItem.classList.add('correct');
                          checkbox.innerHTML = '&#10003;'; 
                      } else {
                          answerItem.classList.add('incorrect');
                          checkbox.innerHTML = '&#10007;'; 
                      }
                  }
              }

              function showResults() {
                  document.getElementById('question-counter').style.display = 'none';
                  document.getElementById('question-container').style.display = 'none';
                  
                  // Calculate Score
                  const correctCount = questions.filter(q => q.firstAttemptCorrect === true).length;
                  const wrongCount = questions.filter(q => q.firstAttemptCorrect === false).length;
                  const skippedCount = questions.length - correctCount - wrongCount;
                  const percentage = Math.round((correctCount / questions.length) * 100);

                  finalScorePercentEl.textContent = `${percentage}%`;
                  finalScoreBreakdownEl.textContent = `${correctCount} Correct | ${wrongCount} Incorrect | ${skippedCount} Skipped`;

                  if (percentage >= 80) {
                      finalScorePercentEl.className = 'score-text pass';
                      finalMessageEl.innerHTML = `<b>Congratulations!</b> You have demonstrated expert-level knowledge of OpenShift AI 3.4 platform administration. You may proceed directly to the Runbook and skip the interactive setup labs.`;
                  } else {
                      finalScorePercentEl.className = 'score-text fail';
                      finalMessageEl.innerHTML = `You're on your way, but there are a few architectural concepts we need to solidify. Please proceed to the Runbook and complete the interactive setup labs below to build your foundational skills.`;
                  }

                  resultsContainerEl.style.display = 'block';

                  // Update Nav
                  prevBtn.style.display = 'none';
                  nextBtn.style.display = 'none';
                  resultsBtn.style.display = 'none';
                  restartBtn.style.display = 'inline-block';
              }

              function updateNavigation() {
                  prevBtn.style.display = currentQuestionIndex > 0 ? 'inline-block' : 'none';
                  
                  const isLastQuestion = currentQuestionIndex === questions.length - 1;
                  nextBtn.style.display = isLastQuestion ? 'none' : 'inline-block';
                  resultsBtn.style.display = isLastQuestion ? 'inline-block' : 'none';
                  restartBtn.style.display = 'none';

                  const navContainer = document.getElementById('navigation-container');
                  navContainer.style.justifyContent = currentQuestionIndex === 0 ? 'flex-end' : 'space-between';
              }

              // --- Event Listeners ---
              answersContainerEl.addEventListener('click', handleAnswerClick);

              nextBtn.addEventListener('click', () => {
                  if (currentQuestionIndex < questions.length - 1) {
                      currentQuestionIndex++;
                      displayQuestion(currentQuestionIndex);
                  }
              });

              prevBtn.addEventListener('click', () => {
                  if (currentQuestionIndex > 0) {
                      currentQuestionIndex--;
                      displayQuestion(currentQuestionIndex);
                  }
              });

              resultsBtn.addEventListener('click', () => {
                  showResults();
              });

              restartBtn.addEventListener('click', () => {
                  // Reset tracking logic for a fresh attempt
                  questions.forEach(q => q.firstAttemptCorrect = null);
                  currentQuestionIndex = 0;
                  displayQuestion(currentQuestionIndex);
              });

              // Initial Load
              displayQuestion(currentQuestionIndex);
          }
      } catch (err) {
          document.body.innerHTML = `<p style="color:red; font-weight:bold;">Initialization Error: ${err.message}</p>`;
      }
    </script>
  </body>
</html>
